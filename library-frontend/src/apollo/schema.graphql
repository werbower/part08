type Author {
    id: ID
    name: String
    born: Int
    bookCount: Int
  }
  
  type Book {
    title: String
    published: String
    author: String
    id: ID
    genres: [String]
  }

  type Query {
    dummy: Int
    bookCount: Int
    authorCount: Int
    allBooks(author: String, genre: String): [Book]
    allAuthors: [Author]
  }
  
  type Mutation {
    addBook(
      title: String!
      author: String!
      published: Int!
      genres: [String!]!
    ): Book

    editAuthor(
      name: String!
      setBornTo: Int!
    ): Author
  }